<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Mesas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <header>

        <h1>🍔 Restaurante</h1>

        <nav>

            <a href="/">Inicio</a>

            <a href="/clientes">Clientes</a>

            <a href="/mesas">Mesas</a>

            <a href="/productos">Productos</a>

            <a href="/categorias">Categorías</a>

            <a href="/pedidos">Pedidos</a>

        </nav>

    </header>

    <section class="hero">

        <h2>🪑 Gestión de Mesas</h2>

        <p>

            Administración de mesas del restaurante.

        </p>

        <a class="btn" href="/mesas/nueva">

            ➕ Nueva mesa

        </a>

    </section>

    <section class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Número</th>

                    <th>Capacidad</th>

                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="mesa : ${mesas}">

                    <td th:text="${mesa.id}"></td>

                    <td th:text="${mesa.numero}"></td>

                    <td th:text="${mesa.capacidad}"></td>

                    <td>

                        <a class="btn" th:href="@{/mesas/editar/{id}(id=${mesa.id})}">

                            ✏️ Editar

                        </a>

                        <a class="btn delete" th:href="@{/mesas/eliminar/{id}(id=${mesa.id})}">

                            🗑️ Eliminar

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

    <footer>

        Restaurante © 2026

    </footer>

</body>

</html>
