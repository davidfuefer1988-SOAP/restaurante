<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Producto</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <header>

        <h1>🍕 Producto</h1>

    </header>

    <section class="form-container">

        <h2 th:text="${producto.id==0} ?

'➕ Nuevo Producto' :

'✏️ Editar Producto'">

            Producto

        </h2>

        <form th:action="${producto.id==0} ?

@{/productos/guardar} :

@{/productos/actualizar}" th:object="${producto}" method="post">

            <input type="hidden" th:field="*{id}">

            <label>

                Nombre

            </label>

            <input type="text" th:field="*{nombre}" required>

            <label>

                Precio (€)

            </label>

            <input type="number" step="0.01" th:field="*{precio}" required>

            <button class="btn">

                💾 Guardar producto

            </button>

        </form>

        <br>

        <a class="btn volver" href="/productos">

            ⬅ Volver

        </a>

    </section>

</body>

</html>
